{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="section container">
  <h1>{% trans "Réinitialiser le mot de passe" %}</h1>
  <p>{% trans "Entrez votre adresse email pour recevoir un lien de réinitialisation." %}</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="button is-primary">{% trans "Envoyer le lien" %}</button>
  </form>
</section>
{% endblock %}
