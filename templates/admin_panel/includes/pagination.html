{% load i18n %}
{% if page_obj.has_other_pages %}
<div class="flex justify-center gap-2 mt-5">
  {% if page_obj.has_previous %}
  <a href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}{% if status_filter %}&status={{ status_filter }}{% endif %}{% if statut_filter %}&statut={{ statut_filter }}{% endif %}{% if role_filter %}&role={{ role_filter }}{% endif %}"
     class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm hover:bg-slate-50 transition-colors">← {% trans "Précédent" %}</a>
  {% endif %}
  <span class="px-4 py-2 text-sm text-slate-500">{% trans "Page" %} {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}{% if status_filter %}&status={{ status_filter }}{% endif %}{% if statut_filter %}&statut={{ statut_filter }}{% endif %}{% if role_filter %}&role={{ role_filter }}{% endif %}"
     class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm hover:bg-slate-50 transition-colors">{% trans "Suivant" %} →</a>
  {% endif %}
</div>
{% endif %}
