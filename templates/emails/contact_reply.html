<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>{{ subject }}</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:20px;">
  <div style="max-width:600px;margin:0 auto;background:white;border-radius:8px;padding:32px;border:1px solid #e0e0e0;">
    <h2 style="color:#1A3C6E;margin-top:0;">{{ subject }}</h2>
    <p>Bonjour {{ to_name }},</p>
    <div style="background:#f8fafc;border-left:4px solid #0ea5e9;padding:16px;margin:20px 0;border-radius:4px;white-space:pre-wrap;">{{ reply_message }}</div>
    <p style="color:#555;">Cordialement,<br><strong>{{ staff_name }}</strong><br>{{ site_name }}</p>
    <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0;">
    <p style="color:#999;font-size:0.8em;">© 2026 {{ site_name }} — Lomé, Togo</p>
  </div>
</body>
</html>
